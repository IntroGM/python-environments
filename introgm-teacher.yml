name: introgm-teacher
channels:
  - conda-forge

dependencies:
  # Core Python stuff
  - python==3.11.15
  - pip==26.1.1

  # General scientific packages
  - numpy==2.4.3
  - pandas==3.0.2
  - scipy==1.17.1

  # Plotting
  - matplotlib==3.10.9

  # Code testing
  - pynose==1.5.5

  # Jupyter environment
  - jupyterlab==4.1.8
  - jupyterlab-git==0.52.0
  - notebook==7.1.3
  - ipython==8.22.2
  - ipykernel==7.2.0

  # RISE for notebook presentations
  - jupyterlab_rise==0.43.1

  # Nicer markdown stuff
  - myst-nb=1.4.0

  # Spell checking
  - jupyterlab-spellchecker=0.8.4

  # Code formatting
  - black-jupyter==26.3.1
  - flake8==7.3.0

  # pip stuff
  - pip:
    - jupyterlab_myst==2.6.0
